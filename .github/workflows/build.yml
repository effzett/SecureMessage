name: Test and package SecureMessage

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Qt-Systembibliotheken für Headless-Tests
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Prüfen, ob die GUI importierbar ist
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "import securemessage.gui"

  windows:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name SecureMessage main.py
      - name: Package Windows executable
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { 'test' }
          Copy-Item dist/SecureMessage.exe "SecureMessage-$version-Windows-x64.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: SecureMessage-Windows-x64
          path: SecureMessage-*-Windows-x64.exe

  macos:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --windowed --name SecureMessage main.py
      - name: Package macOS disk image
        shell: bash
        run: |
          version="test"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; fi
          packaging/build_dmg.sh "SecureMessage-${version}-macOS-arm64.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: SecureMessage-macOS-arm64
          path: SecureMessage-*-macOS-arm64.dmg

  release:
    needs: [tests, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --title "SecureMessage $GITHUB_REF_NAME" --notes "Unsignierte Testversion. Keine unabhängige Sicherheitsprüfung. macOS und Windows warnen beim ersten Start; wie man das löst, steht in der README unter „Installation der fertigen Programme“ (macOS zusätzlich als LIESMICH.txt im DMG)." --verify-tag
